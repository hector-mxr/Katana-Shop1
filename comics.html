<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Katana-Shop-Manga</title>
    <link rel="stylesheet" href="mangacss.css">
</head>
<body>
    <header>
        <div class="logo-titulo">
            <a href="index.html">
                <img src="Logo.jpg" alt="Logo Katana-Shop" class="logo-pequeno">
            </a>
            <h1>Comics</h1>
        </div>

        <div class="container-icon">
            <svg class="icon-cart"
            xmlns="http://www.w3.org/2000/svg"
            width="32"
            height="32"
            viewBox="0 0 24 24"
            fill="none"
            stroke="#000000"
            stroke-width="1"
            stroke-linecap="round"
            stroke-linejoin="round"
            >
            <path d="M6.331 8h11.339a2 2 0 0 1 1.977 2.304l-1.255 8.152a3 3 0 0 1 -2.966 2.544h-6.852a3 3 0 0 1 -2.965 -2.544l-1.255 -8.152a2 2 0 0 1 1.977 -2.304z" />
            <path d="M9 11v-5a3 3 0 0 1 6 0v5" />
            </svg>
            <div class="count products">
                <span id="contador-productos" 0></span>
            </div>
            <div class="container-cart products .hidencarts">
                <div class="cart-product">
                    
                </div>
            </div>
        </div>
    </header>

    
    <main class="sombra">
        <div class="container-items">
            <div class="item">
                <figure>
                    <img src="c1.jpg" alt="Producto">
                </figure>
                <div class="info-product">
                    <h2>Spider-Man</h2>
                    <p class="price">$80</p>
                    <button>Añadir al carrito</button>
                </div>
            </div>

            <div class="item">
                <figure>
                    <img src="c2.jpg" alt="Producto">
                </figure>
                <div class="info-product">
                    <h2>Batman</h2>
                    <p class="price">$60</p>
                    <button>Añadir al carrito</button>
                </div>
            </div>

            <div class="item">
                <figure>
                    <img src="c3.jpg" alt="Producto">
                </figure>
                <div class="info-product">
                    <h2>Spawn</h2>
                    <p class="price">$50</p>
                    <button>Añadir al carrito</button>
                </div>
            </div>

            <div class="item">
                <figure>
                    <img src="c4.jpg" alt="Producto">
                </figure>
                <div class="info-product">
                    <h2>X-Men</h2>
                    <p class="price">$70</p>
                    <button>Añadir al carrito</button>
                </div>
            </div>

            <div class="item">
                <figure>
                    <img src="c5.jpg" alt="Producto">
                </figure>
                <div class="info-product">
                    <h2>Joker</h2>
                    <p class="price">$50</p>
                    <button>Añadir al carrito</button>
                </div>
            </div>

            <div class="item">
                <figure>
                    <img src="c6.jpg" alt="Producto">
                </figure>
                <div class="info-product">
                    <h2>Superman</h2>
                    <p class="price">$55</p>
                    <button>Añadir al carrito</button>
                </div>
            </div>

            <div class="item">
                <figure>
                    <img src="c7.jpg" alt="Producto">
                </figure>
                <div class="info-product">
                    <h2>Deadpool</h2>
                    <p class="price">$85</p>
                    <button>Añadir al carrito</button>
                </div>
            </div>

            <div class="item">
                <figure>
                    <img src="c8.jpg" alt="Producto">
                </figure>
                <div class="info-product">
                    <h2>Watchmen</h2>
                    <p class="price">$45</p>
                    <button>Añadir al carrito</button>
                </div>
            </div>

            <div class="item">
                <figure>
                    <img src="c9.jpg" alt="Producto">
                </figure>
                <div class="info-product">
                    <h2>Apocalipsis Z</h2>
                    <p class="price">$60</p>
                    <button>Añadir al carrito</button>
                </div>
            </div>
        </div>
    </main>
</body>
</html>
