<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Katana-Shop-Manga</title>
    <link rel="stylesheet" href="mangacss.css">
</head>
<body>
    <header>
        <div class="logo-titulo">
            <a href="index.html">
                <img src="Logo.jpg" alt="Logo Katana-Shop" class="logo-pequeno">
            </a>
            <h1>Manwhuas</h1>
        </div>

        <div class="container-icon">
            <svg class="icon-cart"
            xmlns="http://www.w3.org/2000/svg"
            width="32"
            height="32"
            viewBox="0 0 24 24"
            fill="none"
            stroke="#000000"
            stroke-width="1"
            stroke-linecap="round"
            stroke-linejoin="round"
            >
            <path d="M6.331 8h11.339a2 2 0 0 1 1.977 2.304l-1.255 8.152a3 3 0 0 1 -2.966 2.544h-6.852a3 3 0 0 1 -2.965 -2.544l-1.255 -8.152a2 2 0 0 1 1.977 -2.304z" />
            <path d="M9 11v-5a3 3 0 0 1 6 0v5" />
            </svg>
            <div class="count products">
                <span id="contador-productos" 0></span>
            </div>
            <div class="container-cart products .hidencarts">
                <div class="cart-product">
                    
                </div>
            </div>
        </div>
    </header>

    
    <main class="sombra">
        <div class="container-items">
            <div class="item">
                <figure>
                    <img src="w1.jpg" alt="Producto">
                </figure>
                <div class="info-product">
                    <h2>The World After The Fall</h2>
                    <p class="price">$60</p>
                    <button>Añadir al carrito</button>
                </div>
            </div>

            <div class="item">
                <figure>
                    <img src="w2.jpg" alt="Producto">
                </figure>
                <div class="info-product">
                    <h2>Relife Player</h2>
                    <p class="price">$30</p>
                    <button>Añadir al carrito</button>
                </div>
            </div>

            <div class="item">
                <figure>
                    <img src="w3.jpg" alt="Producto">
                </figure>
                <div class="info-product">
                    <h2>Skeleton Soldier</h2>
                    <p class="price">$30</p>
                    <button>Añadir al carrito</button>
                </div>
            </div>

            <div class="item">
                <figure>
                    <img src="w4.jpg" alt="Producto">
                </figure>
                <div class="info-product">
                    <h2>Boundless Necromancer</h2>
                    <p class="price">$40</p>
                    <button>Añadir al carrito</button>
                </div>
            </div>

            <div class="item">
                <figure>
                    <img src="w5.jpg" alt="Producto">
                </figure>
                <div class="info-product">
                    <h2>Eleceed</h2>
                    <p class="price">$20</p>
                    <button>Añadir al carrito</button>
                </div>
            </div>

            <div class="item">
                <figure>
                    <img src="w6.jpg" alt="Producto">
                </figure>
                <div class="info-product">
                    <h2>Leviatan</h2>
                    <p class="price">$30</p>
                    <button>Añadir al carrito</button>
                </div>
            </div>

            <div class="item">
                <figure>
                    <img src="w7.jpg" alt="Producto">
                </figure>
                <div class="info-product">
                    <h2>Beginning After The End</h2>
                    <p class="price">$45</p>
                    <button>Añadir al carrito</button>
                </div>
            </div>

            <div class="item">
                <figure>
                    <img src="w8.jpg" alt="Producto">
                </figure>
                <div class="info-product">
                    <h2>Solo Leveling</h2>
                    <p class="price">$50</p>
                    <button>Añadir al carrito</button>
                </div>
            </div>

            <div class="item">
                <figure>
                    <img src="w9.jpg" alt="Producto">
                </figure>
                <div class="info-product">
                    <h2>Memorize</h2>
                    <p class="price">$35</p>
                    <button>Añadir al carrito</button>
                </div>
            </div>
        </div>
    </main>
</body>
</html>
